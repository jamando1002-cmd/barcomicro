  :root{

    --text: #f0edff;         /* Texto principal claro ligeramente violeta */

  html,body{

<body>

  <div class="estado">
    <div class="punto" id="punto"></div>
    <span id="textoEstado">DESCONECTADO</span>
    <button id="btnConectar">RECONECTAR</button>
  </div>

  <div class="telemetria">
    <div class="tele-modo">
      <span class="tele-punto" id="modoPunto"></span>
      <span id="modoTexto">--</span>
    </div>
    <div class="siete" id="siete">
      <div class="seg seg-a"></div><div class="seg seg-b"></div><div class="seg seg-c"></div>
      <div class="seg seg-d"></div><div class="seg seg-e"></div><div class="seg seg-f"></div>
      <div class="seg seg-g"></div>
    </div>
    <div class="tele-dir" id="barraDir"></div>
    <div class="tele-bateria">
      <div class="bateria-barra"><div class="bateria-fill" id="bateriaFill"></div></div>
      <span id="bateriaTexto">--%</span>
    </div>
    <div class="tele-alarma" id="alarmaTexto"></div>
  </div>

  <div class="zonaJoystick">
    <span class="etiqueta et-avante">AVANTE</span>
    <span class="etiqueta et-atras">ATRÁS</span>
    <span class="etiqueta et-babor">BABOR</span>
    <span class="etiqueta et-estribor">ESTRIBOR</span>
    <canvas id="joy" width="240" height="240"></canvas>
  </div>

  <div class="fila-botones">
    <button class="btn-modo" id="btnModo">Modo</button>
    <button class="btn-modo" id="btnGrabar">Grabar</button>
    <button class="btn-modo" id="btnGuardar">Guardar</button>
  </div>

  <div id="overlay">
    <h1>CONTROL DEL BARCO</h1>
    <button id="btnConectarGrande">Conectar por Bluetooth</button>
    <div id="estadoError"></div></div>

<script>
const SERVICE_UUID  = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
const CHAR_UUID      = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
const CHAR_ESTADO_UUID = '0072f14a-1912-43ea-bd79-9fa5a10c00df';

let caracteristica = null;
let caracteristicaEstado = null;
let dispositivo = null;

const punto        = document.getElementById('punto');
const textoEstado   = document.getElementById('textoEstado');
const overlay       = document.getElementById('overlay');
const estadoError    = document.getElementById('estadoError');

function marcarConectado(si){
  punto.classList.toggle('conectado', si);
  textoEstado.textContent = si ? 'CONECTADO' : 'DESCONECTADO';
  overlay.classList.toggle('oculto', si);
  if (!si) limpiarTelemetria();
}

async function conectar(){
  estadoError.textContent = '';
  if (!navigator.bluetooth) {
    estadoError.textContent = 'Este navegador no soporta Web Bluetooth. Usa Chrome en Android.';
    return;
  }
  try {
    dispositivo = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });
    dispositivo.addEventListener('gattserverdisconnected', () => marcarConectado(false));

    const servidor  = await dispositivo.gatt.connect();
    const servicio  = await servidor.getPrimaryService(SERVICE_UUID);
    caracteristica  = await servicio.getCharacteristic(CHAR_UUID);

    caracteristicaEstado = await servicio.getCharacteristic(CHAR_ESTADO_UUID);
    await caracteristicaEstado.startNotifications();
    caracteristicaEstado.addEventListener('characteristicvaluechanged', manejarTelemetria);

    marcarConectado(true);
  } catch (err) {
    estadoError.textContent = 'No se pudo conectar: ' + err.message;
  }
}

document.getElementById('btnConectarGrande').onclick = conectar;
document.getElementById('btnConectar').onclick = conectar;

/* ---------------- Estado combinado (joystick + botones) ---------------- */
const CENTRO_EJE = 128;
let velActual = CENTRO_EJE, dirActual = CENTRO_EJE;
let botonesEstado = 0;

function enviarEstado(){
  if (!caracteristica) return;
  const datos = new Uint8Array([0xAA, velActual & 0xFF, dirActual & 0xFF, botonesEstado & 0xFF]);
  caracteristica.writeValueWithoutResponse
    ? caracteristica.writeValueWithoutResponse(datos).catch(()=>{})
    : caracteristica.writeValue(datos).catch(()=>{});
}

/* ---------------- Telemetria (espejo del PIC) ---------------- */
const EJE_CENTRO_PIC = 84;
const VEL_UMBRAL = { HB:24, MB:48, LB:72, O:96, LF:120, MF:144 };
const DIR_UMBRAL = [17, 34, 50, 67, 101, 118, 134, 151];
const PATRON = {
  H_ATRAS:0x5C, M_ATRAS:0x4C, L_ATRAS:0x48, REPOSO:0x40,
  L_ADELANTE:0xC0, M_ADELANTE:0xC2, H_ADELANTE:0xE2
};
const BATERIA_ADC_VACIO = 153, BATERIA_ADC_LLENO = 215;
const MODOS = ['MANUAL', 'CRUCERO', 'GRABACIÓN', 'PILOTO AUTOMÁTICO'];

// Colores actualizados para los diferentes modos en el indicador LED circular
const MODO_COLOR = ['#39ff14', '#00f0ff', '#ff0055', '#ffb700'];

function patronParaVelocidad(v){
  if (v < VEL_UMBRAL.HB) return PATRON.H_ATRAS;
  if (v < VEL_UMBRAL.MB) return PATRON.M_ATRAS;
  if (v < VEL_UMBRAL.LB) return PATRON.L_ATRAS;
  if (v < VEL_UMBRAL.O)  return PATRON.REPOSO;
  if (v < VEL_UMBRAL.LF) return PATRON.L_ADELANTE;
  if (v < VEL_UMBRAL.MF) return PATRON.M_ADELANTE;
  return PATRON.H_ADELANTE;
}
function decodePatron(byte){
  return {
    a: !!(byte & 0x80), g: !!(byte & 0x40), f: !!(byte & 0x20),
    e: !!(byte & 0x10), d: !!(byte & 0x08), c: !!(byte & 0x04),
    b: !!(byte & 0x02)
  };
}
function ledsParaDireccion(d){
  const leds = new Array(10).fill(false);
  if (d < DIR_UMBRAL[0]) { leds[0]=true; }
  else if (d < DIR_UMBRAL[1]) { leds[1]=true; }
  else if (d < DIR_UMBRAL[2]) { leds[2]=true; }
  else if (d < DIR_UMBRAL[3]) { leds[3]=true; }
  else if (d < DIR_UMBRAL[4]) { leds[4]=true; leds[5]=true; }
  else if (d < DIR_UMBRAL[5]) { leds[6]=true; }
  else if (d < DIR_UMBRAL[6]) { leds[7]=true; }
  else if (d < DIR_UMBRAL[7]) { leds[8]=true; }
  else { leds[9]=true; }
  return leds;
}
function porcentajeBateria(adc){
  const p = Math.round((adc - BATERIA_ADC_VACIO) / (BATERIA_ADC_LLENO - BATERIA_ADC_VACIO) * 100);
  return Math.max(0, Math.min(100, p));
}

const modoPunto     = document.getElementById('modoPunto');
const modoTexto      = document.getElementById('modoTexto');
const segmentos       = {};
document.querySelectorAll('#siete .seg').forEach(el=>{
  const letra = [...el.classList].find(c => c.startsWith('seg-')).replace('seg-','');
  segmentos[letra] = el;
});
const barraDir = document.getElementById('barraDir');
const dots = [];
for (let i=0;i<10;i++){
  const d = document.createElement('div');
  d.className = 'dot';
  barraDir.appendChild(d);
  dots.push(d);
}
const bateriaFill = document.getElementById('bateriaFill');
const bateriaTexto = document.getElementById('bateriaTexto');
const alarmaTexto = document.getElementById('alarmaTexto');

function limpiarTelemetria(){
  modoPunto.style.background = '';
  modoTexto.textContent = '--';
  Object.values(segmentos).forEach(el => el.classList.remove('lit'));
  dots.forEach(d => d.classList.remove('lit'));
  bateriaFill.style.width = '0%';
  bateriaTexto.textContent = '--%';
  alarmaTexto.textContent = '';
  alarmaTexto.className = 'tele-alarma';
}

function manejarTelemetria(evento){
  const dv = evento.target.value;
  if (dv.byteLength < 6) return;
  if (dv.getUint8(0) !== 0xBB) return;

  const modo      = dv.getUint8(1);
  const velocidad = dv.getUint8(2);
  const direccion = dv.getUint8(3);
  const alarma    = dv.getUint8(4);
  const bateria   = dv.getUint8(5);

  modoTexto.textContent = MODOS[modo] || '--';
  modoPunto.style.background = MODO_COLOR[modo] || '#6e648f';

  const p = decodePatron(patronParaVelocidad(velocidad));
  for (const letra in segmentos) segmentos[letra].classList.toggle('lit', !!p[letra]);

  const leds = ledsParaDireccion(direccion);
  dots.forEach((d,i) => d.classList.toggle('lit', leds[i]));

  if (alarma) {
    alarmaTexto.textContent = 'REPOSO';
    alarmaTexto.className = 'tele-alarma reposo';
  } else if (velocidad < EJE_CENTRO_PIC) {
    alarmaTexto.textContent = 'ATRÁS';
    alarmaTexto.className = 'tele-alarma';
  } else {
    alarmaTexto.textContent = '';
    alarmaTexto.className = 'tele-alarma';
  }

  const pct = porcentajeBateria(bateria);
  bateriaFill.style.width = pct + '%';
  bateriaFill.classList.toggle('baja', pct < 20);
  bateriaTexto.textContent = pct + '%';
}

/* ---------------- Joystick (Redibujado con nuevos colores) ---------------- */
const canvas = document.getElementById('joy');
const ctx = canvas.getContext('2d');
const RADIO = 100, CENTRO = 120, RADIO_PERILLA = 26;
let knobX = CENTRO, knobY = CENTRO, activo = false, ultimoEnvio = 0;

function dibujarJoystick(){
  ctx.clearRect(0,0,240,240);

  // Fondo del joystick
  ctx.beginPath();
  ctx.arc(CENTRO, CENTRO, RADIO, 0, Math.PI*2);
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--panel');
  ctx.fill();
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--track');
  ctx.lineWidth = 2;
  ctx.stroke();

  // Muescas de los ángulos
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
  ctx.lineWidth = 1.5;
  for (let a = 0; a < 360; a += 30){
    const rad = a * Math.PI/180;
    const x1 = CENTRO + Math.cos(rad)*(RADIO-4);
    const y1 = CENTRO + Math.sin(rad)*(RADIO-4);
    const x2 = CENTRO + Math.cos(rad)*(RADIO-12);
    const y2 = CENTRO + Math.sin(rad)*(RADIO-12);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }

  // Ejes guías centrales
  ctx.strokeStyle = 'rgba(110, 100, 143, 0.2)';
  ctx.beginPath(); ctx.moveTo(CENTRO-RADIO,CENTRO); ctx.lineTo(CENTRO+RADIO,CENTRO); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CENTRO,CENTRO-RADIO); ctx.lineTo(CENTRO,CENTRO+RADIO); stroke();

  // Perilla deslizante (Cambia a cian neón al activarse)
  ctx.beginPath();
  ctx.arc(knobX, knobY, RADIO_PERILLA, 0, Math.PI*2);
  ctx.fillStyle = activo ? '#00f0ff' : '#2a2244';
  ctx.fill();
  ctx.strokeStyle = activo ? '#ffffff' : '#6e648f'; 
  ctx.lineWidth = 3; 
  ctx.stroke();
}
dibujarJoystick();function posDesdeEvento(e){
  const r = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  let dx = cx - CENTRO, dy = cy - CENTRO;
  const dist = Math.hypot(dx,dy);
  if (dist > RADIO){ dx = dx/dist*RADIO; dy = dy/dist*RADIO; }
  return {dx,dy};
}

function mover(e){
  e.preventDefault();
  const {dx,dy} = posDesdeEvento(e);
  knobX = CENTRO+dx; knobY = CENTRO+dy;
  dibujarJoystick();

  const ahora = Date.now();
  if (ahora - ultimoEnvio < 60) return;
  ultimoEnvio = ahora;

  dirActual = Math.round(((dx/RADIO)+1)*127.5);
  velActual = Math.round((((-dy)/RADIO)+1)*127.5);
  enviarEstado();
}

function soltar(){
  activo = false;
  knobX = CENTRO; knobY = CENTRO;
  dibujarJoystick();
  velActual = CENTRO_EJE;
  dirActual = CENTRO_EJE;
  enviarEstado();
}

canvas.addEventListener('pointerdown', (e)=>{ activo = true; mover(e); });
canvas.addEventListener('pointermove', (e)=>{ if (activo) mover(e); });
window.addEventListener('pointerup', ()=>{ if (activo) soltar(); });

/* ---------------- Botones de modo ---------------- */
function pulsarBoton(bit){
  botonesEstado |= bit;
  enviarEstado();
  setTimeout(()=>{
    botonesEstado &= ~bit;
    enviarEstado();
  }, 80);
}
document.getElementById('btnModo').onclick = () => pulsarBoton(0x01);
document.getElementById('btnGuardar').onclick = () => pulsarBoton(0x04);

const btnGrabar = document.getElementById('btnGrabar');
function grabarInicio(e){
  e.preventDefault();
  btnGrabar.classList.add('activo');
  botonesEstado |= 0x02;
  enviarEstado();
}
function grabarFin(e){
  e.preventDefault();
  btnGrabar.classList.remove('activo');
  botonesEstado &= ~0x02;
  enviarEstado();
}
btnGrabar.addEventListener('pointerdown', grabarInicio);
btnGrabar.addEventListener('pointerup', grabarFin);
btnGrabar.addEventListener('pointerleave', grabarFin);
</script>
</body>
</html>
